version: '3.8'

services:
  mineru-vlm-api:
    # 生产环境使用构建的镜像
    image: rstarall/mineru-vlm-api:latest
    # 如需从源码构建，取消注释下面的 build 配置
    # build:
    #   context: .
    #   dockerfile: Dockerfile.prod
    #   args:
    #     PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    #     PIP_TRUSTED_HOST: pypi.tuna.tsinghua.edu.cn
    container_name: mineru-vlm-api-prod
    ports:
      - "8000:8000"
    volumes:
      # 生产环境只挂载数据和配置目录
      - ./output:/app/output
      - ./logs:/app/logs
      - ./temp:/app/temp
      - ./models_cache:/root/.cache
      - ./mineru.json:/root/mineru.json:ro
    environment:
      - MINERU_MODEL_SOURCE=modelscope
      - LOG_LEVEL=info
      - PORT=8000
      - HOST=0.0.0.0
      # 生产环境优化
      - OMP_NUM_THREADS=16
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
    deploy:
      resources:
        limits:
          memory: 64G
          cpus: '32'
        reservations:
          memory: 32G
          cpus: '16'
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - mineru-network

  # SGLang 服务器 (可选，用于 sglang-client 后端)
  sglang-server:
    image: lmsysorg/sglang:v0.4.7-cu124
    container_name: sglang-server-prod
    ports:
      - "30000:30000"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_PATH=opendatalab/MinerU2.0-2505-0.9B
    command: >
      python -m sglang.launch_server
      --model-path ${MODEL_PATH:-opendatalab/MinerU2.0-2505-0.9B}
      --host 0.0.0.0
      --port 30000
      --tp-size 1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mineru-network
    profiles:
      - sglang

networks:
  mineru-network:
    driver: bridge

# 使用说明:
# 1. 生产环境部署: docker-compose -f docker-compose.prod.yml up -d
# 2. 包含 SGLang 服务: docker-compose -f docker-compose.prod.yml --profile sglang up -d
# 3. 查看日志: docker-compose -f docker-compose.prod.yml logs -f
# 4. 停止服务: docker-compose -f docker-compose.prod.yml down 